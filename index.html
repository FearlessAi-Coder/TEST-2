function getAC(){
  if(ac)return ac;
  try{
    ac=new(window.AudioContext||window.webkitAudioContext)();
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=5;comp.connect(ac.destination);
    sfxBus=ac.createGain();musBus=ac.createGain();sfxBus.connect(comp);musBus.connect(comp);
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    applyVol();
  }catch(e){ac=null;}
  return ac;
}
function applyVol(){if(!ac)return;sfxBus.gain.value=S.sfx?S.vs:0;musBus.gain.value=S.mus?S.vm:0;}

function beep(f,d,type,v,slide){

  try{if(!getAC())return;if(ac.state==='suspended')ac.resume().catch(()=>{});const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+d);}catch(e){}
}

  v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.012);v.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.04,d));
  o.connect(v);let out=v;if(lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;v.connect(fl);out=fl;}
  out.connect(musBus);o.start(t);o.stop(t+Math.max(.04,d)+.03);

function update(k){
  frame+=k;flash=Math.max(0,flash-.07*k);toastT=Math.max(0,toastT-k);shake=Math.max(0,shake-.8*k);
  parts.forEach(p=>{p.x+=p.vx*k;p.y+=p.vy*k;p.vy+=.15*k;p.l-=.03*k});parts=parts.filter(p=>p.l>0);

  if(pipes[0].x<-PW)pipes.shift();
  const lp=pipes[pipes.length-1];if(lp.x<W-SP()+40)spawnPipe(lp.x+SP());

    if(!p.done&&p.x+PW<BX-R){
      p.done=true;const perfect=Math.abs(y-(t+p.g/2))<p.g*(.13+perk('pf'));
      if(perfect){combo++;score+=2;say(combo>1?'PERFECT x'+combo:'PERFECT!','#ffd23f');}else{combo=0;score++;{const ed=Math.min(y-t,t+p.g-y);if(ed<R+7){say('CLOSE!','#ff9a3d');burst(BX,y,'#ff9a3d',10);}}}
      S.st.pipes++;if(S.mode==='adv'){advPP++;if(perfect)advPC++;if(advPP>=advT())advDone=true;}if(score>=25){const nk=Object.keys(SKIES);skyOv=nk[(nk.indexOf(S.eq.sky)+Math.floor(score/25))%nk.length];}mp('pipes',1);mp('score',score,1);beep(880+Math.min(combo,8)*60,.08,'square',.04);checkAch();if(Math.floor(score/25)>rushN){rushN=Math.floor(score/25);dbl=Math.max(dbl,540);say('GOLDEN RUSH! 2X COINS','#ffd23f');burst(BX,y,'#ffd23f',24);beep(1500,.2,'triangle',.06,400);}

      {const ps=score-(perfect?2:1);if(Math.floor(score/10)>Math.floor(ps/10)){say('SCORE '+Math.floor(score/10)*10+'!','#7fe0ff');beep(1320,.1,'triangle',.05);beep(1760,.18,'triangle',.05);}}

    }

      if(!p.got&&Math.hypot(p.x+PW/2+p.ox-BX,t+p.g/2+p.oy-y)<R+11){
        p.got=true;const it=p.item;
        if(it==='coin'){const v=Math.ceil((dbl>0?2:1)*(evtW().coinx||1));rc+=v;S.coins+=v;S.st.coins+=v;mp('coins',v);beep(990,.06,'square',.04);beep(1320,.1,'square',.04);}
